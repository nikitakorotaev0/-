<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сайт недоступен</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1e2a4a 0%, #0b1120 60%, #05070f 100%);
    color: #e6ecff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 80% 30%, rgba(90, 130, 255, 0.18), transparent 45%),
      radial-gradient(circle at 15% 80%, rgba(180, 90, 255, 0.14), transparent 45%);
    pointer-events: none;
  }

  .card {
    position: relative;
    max-width: 720px;
    width: 100%;
    background: rgba(18, 24, 44, 0.72);
    border: 1px solid rgba(120, 150, 255, 0.22);
    border-radius: 22px;
    padding: 56px 48px;
    text-align: center;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 30px 70px rgba(0, 0, 0, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .glitch {
    font-size: clamp(72px, 14vw, 130px);
    font-weight: 800;
    letter-spacing: 6px;
    line-height: 1;
    background: linear-gradient(135deg, #7aa2ff 0%, #b47aff 50%, #ff6ea8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 40px rgba(120, 140, 255, 0.25);
    margin-bottom: 8px;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.25); }
  }

  .title {
    font-size: clamp(22px, 3.5vw, 30px);
    font-weight: 600;
    margin-bottom: 18px;
    color: #ffffff;
  }

  .divider {
    width: 80px;
    height: 3px;
    margin: 26px auto;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, #7aa2ff, #b47aff, transparent);
  }

  .description {
    font-size: 16px;
    line-height: 1.7;
    color: #a9b6d9;
    margin-bottom: 32px;
  }

  .code {
    display: inline-block;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    color: #8fa6ff;
    background: rgba(120, 150, 255, 0.1);
    border: 1px solid rgba(120, 150, 255, 0.25);
    border-radius: 999px;
    padding: 8px 18px;
    margin-bottom: 28px;
  }

  .footer {
    margin-top: 30px;
    font-size: 13px;
    color: #6c7aa0;
    letter-spacing: 0.5px;
  }

  @media (max-width: 520px) {
    .card { padding: 40px 24px; }
    .glitch { letter-spacing: 3px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="glitch">503</div>
    <div class="title">Сайт временно недоступен</div>
    <div class="divider"></div>
    <p class="description">
      Сервер не может обработать запрос прямо сейчас.<br>
      Мы уже работаем над восстановлением. Попробуйте зайти позже.
    </p>
    <div class="code">Ошибка: SERVICE_UNAVAILABLE</div>

    <!-- ТЕКСТ ЗДЕСЬ -->

    <div class="footer">Мы вернёмся в ближайшее время</div>
  </main>
</body>
</html>
